version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillgraph-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/skillgraph.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillgraph-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
